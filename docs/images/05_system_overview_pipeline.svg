<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<style>
    .title { font: 700 26px 'Arial', 'Helvetica', sans-serif; fill: #1f2937; }
    .subtitle { font: 600 16px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .label { font: 14px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .small { font: 12px 'Arial', 'Helvetica', sans-serif; fill: #4b5563; }
    .tiny { font: 11px 'Arial', 'Helvetica', sans-serif; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
    .accent { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
    .accent2 { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; rx: 12; }
    .accent3 { fill: #ecfeff; stroke: #2dd4bf; stroke-width: 1.5; rx: 12; }
    .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .line { stroke: #94a3b8; stroke-width: 1.4; }
    .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pixel { stroke: #cbd5e1; stroke-width: 1; }
    .note { font: italic 12px 'Arial', 'Helvetica', sans-serif; fill: #475569; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
</defs>
<text x="35" y="42" class="title" text-anchor="start">System overview: development machine → embedded device</text><text x="35" y="70" class="subtitle" text-anchor="start">A more detailed view of the offline compiler, runtime engine, and backends.</text><rect x="40" y="110" width="620" height="440" class="panel" /><rect x="840" y="110" width="620" height="440" class="panel" /><text x="350" y="140" class="subtitle" text-anchor="middle">DEVELOPMENT MACHINE</text><text x="1150" y="140" class="subtitle" text-anchor="middle">EMBEDDED DEVICE</text><rect x="120" y="185" width="320" height="55" class="box" /><text x="280.0" y="207" class="label" text-anchor="middle">TTF / OTF file</text><rect x="120" y="255" width="320" height="150" class="accent" /><text x="280.0" y="277" class="label" text-anchor="middle">fontsampler.py</text><text x="280.0" y="299" class="small" text-anchor="middle">• rasterize at 128 px</text><text x="280.0" y="321" class="small" text-anchor="middle">• threshold to 1 bit</text><text x="280.0" y="343" class="small" text-anchor="middle">• compress rows + Rice-coded runs</text><text x="280.0" y="365" class="small" text-anchor="middle">• extract kerning (kern + GPOS)</text><text x="280.0" y="387" class="small" text-anchor="middle">• emit generated C source</text><rect x="120" y="430" width="320" height="55" class="box" /><text x="280.0" y="452" class="label" text-anchor="middle">Generated C font sources</text><line x1="280" y1="240" x2="280" y2="255" class="arrow"/><line x1="280" y1="405" x2="280" y2="430" class="arrow"/><line x1="440" y1="458" x2="840" y2="458" class="arrow"/><text x="650" y="446" class="small" text-anchor="middle">const arrays compiled into flash</text><rect x="930" y="180" width="440" height="230" class="accent2" /><text x="1150" y="210" class="subtitle" text-anchor="middle">pte.c / pte_resample.h</text><text x="1150" y="245" class="label" text-anchor="middle">glyph lookup</text><text x="1150" y="269" class="label" text-anchor="middle">kerning lookup</text><text x="1150" y="293" class="label" text-anchor="middle">UTF-8 decode</text><text x="1150" y="317" class="label" text-anchor="middle">streaming decode</text><text x="1150" y="341" class="label" text-anchor="middle">scale + subsample</text><text x="1150" y="365" class="label" text-anchor="middle">blend via callback</text><rect x="965" y="430" width="370" height="52" class="box" /><text x="1150" y="462" class="label" text-anchor="middle">Generated C font data in flash</text><line x1="1150" y1="430" x2="1150" y2="410" class="arrow"/><rect x="925" y="505" width="220" height="60" class="accent3" /><rect x="1160" y="505" width="220" height="60" class="accent3" /><text x="1035" y="532" class="label" text-anchor="middle">Standalone renderer</text><text x="1035" y="552" class="small" text-anchor="middle">hw_blendPixel callback</text><text x="1270" y="532" class="label" text-anchor="middle">LVGL adapter</text><text x="1270" y="552" class="small" text-anchor="middle">lv_font_t / A8 output</text><line x1="1035" y1="410" x2="1035" y2="505" class="arrow"/><line x1="1265" y1="410" x2="1265" y2="505" class="arrow"/><text x="1150" y="595" class="small" text-anchor="middle">Same compressed master, shared resampler, different front/back-end integrations.</text></svg>
