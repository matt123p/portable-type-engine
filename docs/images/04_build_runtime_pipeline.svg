<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
<style>
    .title { font: 700 26px 'Arial', 'Helvetica', sans-serif; fill: #1f2937; }
    .subtitle { font: 600 16px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .label { font: 14px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .small { font: 12px 'Arial', 'Helvetica', sans-serif; fill: #4b5563; }
    .tiny { font: 11px 'Arial', 'Helvetica', sans-serif; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
    .accent { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
    .accent2 { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; rx: 12; }
    .accent3 { fill: #ecfeff; stroke: #2dd4bf; stroke-width: 1.5; rx: 12; }
    .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .line { stroke: #94a3b8; stroke-width: 1.4; }
    .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pixel { stroke: #cbd5e1; stroke-width: 1; }
    .note { font: italic 12px 'Arial', 'Helvetica', sans-serif; fill: #475569; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
</defs>
<text x="35" y="42" class="title" text-anchor="start">PTE build-time / runtime pipeline</text><text x="35" y="70" class="subtitle" text-anchor="start">Big-picture view: pre-render once, compress once, then stream and resize on the device.</text><rect x="35" y="105" width="650" height="300" class="panel" /><rect x="715" y="105" width="650" height="300" class="panel" /><text x="360" y="135" class="subtitle" text-anchor="middle">BUILD TIME</text><text x="1040" y="135" class="subtitle" text-anchor="middle">RUNTIME</text><rect x="70" y="185" width="130" height="58" class="box" /><text x="135.0" y="209" class="label" text-anchor="middle">TTF / OTF</text><text x="135.0" y="227" class="label" text-anchor="middle">font</text><rect x="235" y="185" width="150" height="58" class="box" /><text x="310.0" y="209" class="label" text-anchor="middle">Rasterize glyphs</text><text x="310.0" y="227" class="label" text-anchor="middle">at 128 px</text><rect x="420" y="185" width="150" height="58" class="box" /><text x="495.0" y="209" class="label" text-anchor="middle">Threshold</text><text x="495.0" y="227" class="label" text-anchor="middle">to 1-bit</text><rect x="235" y="285" width="150" height="58" class="accent" /><text x="310.0" y="309" class="label" text-anchor="middle">Compress repeated</text><text x="310.0" y="327" class="label" text-anchor="middle">rows + runs</text><rect x="420" y="285" width="150" height="58" class="box" /><text x="495.0" y="309" class="label" text-anchor="middle">Emit const C</text><text x="495.0" y="327" class="label" text-anchor="middle">arrays</text><line x1="200" y1="214" x2="235" y2="214" class="arrow"/><line x1="385" y1="214" x2="420" y2="214" class="arrow"/><line x1="495" y1="243" x2="495" y2="285" class="arrow"/><line x1="385" y1="314" x2="420" y2="314" class="arrow"/><text x="605" y="245" class="small" text-anchor="middle">compiled into firmware</text><line x1="570" y1="314" x2="715" y2="314" class="arrow"/><rect x="765" y="185" width="170" height="58" class="box" /><text x="850.0" y="209" class="label" text-anchor="middle">Compressed</text><text x="850.0" y="227" class="label" text-anchor="middle">master glyph</text><rect x="970" y="185" width="160" height="58" class="box" /><text x="1050.0" y="209" class="label" text-anchor="middle">Stream +</text><text x="1050.0" y="227" class="label" text-anchor="middle">decode</text><rect x="1165" y="185" width="160" height="58" class="accent2" /><text x="1245.0" y="209" class="label" text-anchor="middle">Area resample</text><text x="1245.0" y="227" class="label" text-anchor="middle">to size N</text><rect x="970" y="285" width="160" height="58" class="accent3" /><text x="1050.0" y="309" class="label" text-anchor="middle">Anti-aliased</text><text x="1050.0" y="327" class="label" text-anchor="middle">destination pixels</text><line x1="935" y1="214" x2="970" y2="214" class="arrow"/><line x1="1130" y1="214" x2="1165" y2="214" class="arrow"/><line x1="1245" y1="243" x2="1245" y2="285" class="arrow"/><line x1="1165" y1="314" x2="1130" y2="314" class="arrow" marker-end="url(#arrow)"/><text x="723" y="295" class="small" text-anchor="start">flash / ROM</text><text x="1040" y="375" class="small" text-anchor="middle">Area coverage in the source master becomes alpha in the output.</text></svg>
