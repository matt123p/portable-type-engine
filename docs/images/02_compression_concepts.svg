<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
<style>
    .title { font: 700 26px 'Arial', 'Helvetica', sans-serif; fill: #1f2937; }
    .subtitle { font: 600 16px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .label { font: 14px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .small { font: 12px 'Arial', 'Helvetica', sans-serif; fill: #4b5563; }
    .tiny { font: 11px 'Arial', 'Helvetica', sans-serif; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
    .accent { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
    .accent2 { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; rx: 12; }
    .accent3 { fill: #ecfeff; stroke: #2dd4bf; stroke-width: 1.5; rx: 12; }
    .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .line { stroke: #94a3b8; stroke-width: 1.4; }
    .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pixel { stroke: #cbd5e1; stroke-width: 1; }
    .note { font: italic 12px 'Arial', 'Helvetica', sans-serif; fill: #475569; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
</defs>
<text x="35" y="42" class="title" text-anchor="start">Duplicate-row + run-length compression</text><text x="35" y="70" class="subtitle" text-anchor="start">The master stays 1-bit. Repeated rows are omitted, and literal pixels become alternating runs.</text><rect x="35" y="100" width="300" height="450" class="panel" /><text x="185" y="130" class="subtitle" text-anchor="middle">Example 1-bit glyph bitmap</text><rect x="75" y="165" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="165" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="165" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="165" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="165" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="165" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="165" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="165" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="165" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="165" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="180" class="tiny" text-anchor="end">y0</text><rect x="75" y="187" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="187" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="187" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="187" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="187" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="187" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="187" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="187" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="187" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="187" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="202" class="tiny" text-anchor="end">y1</text><text x="311" y="202" class="small" text-anchor="start">literal</text><rect x="63" y="207" width="244" height="26" fill="#dbeafe" stroke="none" rx="6"/><rect x="75" y="209" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="209" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="209" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="209" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="209" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="209" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="209" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="209" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="209" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="209" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="224" class="tiny" text-anchor="end">y2</text><text x="311" y="224" class="note" text-anchor="start">repeat</text><rect x="75" y="231" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="231" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="231" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="231" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="231" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="231" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="231" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="231" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="231" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="231" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="246" class="tiny" text-anchor="end">y3</text><text x="311" y="246" class="small" text-anchor="start">literal</text><rect x="63" y="251" width="244" height="26" fill="#dbeafe" stroke="none" rx="6"/><rect x="75" y="253" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="253" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="253" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="253" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="253" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="253" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="253" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="253" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="253" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="253" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="268" class="tiny" text-anchor="end">y4</text><text x="311" y="268" class="note" text-anchor="start">repeat</text><rect x="63" y="273" width="244" height="26" fill="#dbeafe" stroke="none" rx="6"/><rect x="75" y="275" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="275" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="275" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="275" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="275" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="275" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="275" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="275" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="275" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="275" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="290" class="tiny" text-anchor="end">y5</text><text x="311" y="290" class="note" text-anchor="start">repeat</text><rect x="75" y="297" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="297" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="297" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="297" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="297" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="297" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="297" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="297" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="297" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="297" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="312" class="tiny" text-anchor="end">y6</text><text x="311" y="312" class="small" text-anchor="start">literal</text><rect x="75" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="97" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="119" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="141" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="163" y="319" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="185" y="319" width="22" height="22" fill="#111827" stroke="#cbd5e1" stroke-width="1"/><rect x="207" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="229" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="251" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="273" y="319" width="22" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="57" y="334" class="tiny" text-anchor="end">y7</text><text x="311" y="334" class="small" text-anchor="start">literal</text><text x="185" y="390" class="small" text-anchor="middle">Blue rows are exact copies of the previous row</text><text x="185" y="410" class="small" text-anchor="middle">They set a header bit and store no pixel data</text><rect x="375" y="100" width="270" height="200" class="panel" /><text x="510" y="130" class="subtitle" text-anchor="middle">1) Repeat-row header</text><text x="510" y="154" class="small" text-anchor="middle">1 = copy previous row, 0 = literal row</text><rect x="405" y="190" width="26" height="26" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="418.0" y="208" class="label" text-anchor="middle">0</text><text x="418.0" y="184" class="tiny" text-anchor="middle">y0</text><rect x="431" y="190" width="26" height="26" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="444.0" y="208" class="label" text-anchor="middle">0</text><text x="444.0" y="184" class="tiny" text-anchor="middle">y1</text><rect x="457" y="190" width="26" height="26" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><text x="470.0" y="208" class="label" text-anchor="middle">1</text><text x="470.0" y="184" class="tiny" text-anchor="middle">y2</text><rect x="483" y="190" width="26" height="26" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="496.0" y="208" class="label" text-anchor="middle">0</text><text x="496.0" y="184" class="tiny" text-anchor="middle">y3</text><rect x="509" y="190" width="26" height="26" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><text x="522.0" y="208" class="label" text-anchor="middle">1</text><text x="522.0" y="184" class="tiny" text-anchor="middle">y4</text><rect x="535" y="190" width="26" height="26" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><text x="548.0" y="208" class="label" text-anchor="middle">1</text><text x="548.0" y="184" class="tiny" text-anchor="middle">y5</text><rect x="561" y="190" width="26" height="26" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="574.0" y="208" class="label" text-anchor="middle">0</text><text x="574.0" y="184" class="tiny" text-anchor="middle">y6</text><rect x="587" y="190" width="26" height="26" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="600.0" y="208" class="label" text-anchor="middle">0</text><text x="600.0" y="184" class="tiny" text-anchor="middle">y7</text><text x="510" y="250" class="small" text-anchor="middle">Rows y2, y4 and y5 are duplicates</text><rect x="375" y="330" width="270" height="220" class="panel" /><text x="510" y="360" class="subtitle" text-anchor="middle">2) Literal rows become runs</text><rect x="405" y="402" width="22" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><rect x="427" y="402" width="22" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><rect x="449" y="402" width="22" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><rect x="471" y="402" width="22" height="22" fill="#111827" stroke="#94a3b8" stroke-width="1"/><rect x="493" y="402" width="22" height="22" fill="#111827" stroke="#94a3b8" stroke-width="1"/><rect x="515" y="402" width="22" height="22" fill="#111827" stroke="#94a3b8" stroke-width="1"/><rect x="537" y="402" width="22" height="22" fill="#111827" stroke="#94a3b8" stroke-width="1"/><rect x="559" y="402" width="22" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><rect x="581" y="402" width="22" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><rect x="603" y="402" width="22" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="510" y="390" class="small" text-anchor="middle">Example literal row: 0001111000</text><rect x="415" y="450" width="54" height="28" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="4"/><text x="442.0" y="469" class="small" text-anchor="middle" fill="#334155">white 3</text><rect x="477" y="450" width="72" height="28" fill="#111827" stroke="#64748b" stroke-width="1.2" rx="4"/><text x="513.0" y="469" class="small" text-anchor="middle" fill="#f8fafc">black 4</text><rect x="557" y="450" width="54" height="28" fill="#ffffff" stroke="#64748b" stroke-width="1.2" rx="4"/><text x="584.0" y="469" class="small" text-anchor="middle" fill="#334155">white 3</text><text x="510" y="505" class="small" text-anchor="middle">Alternating background/foreground run lengths are Rice-coded</text><rect x="690" y="100" width="455" height="450" class="panel" /><text x="918" y="130" class="subtitle" text-anchor="middle">3) Stored glyph payload</text><rect x="740" y="180" width="120" height="80" class="accent" /><text x="800" y="210" class="label" text-anchor="middle">repeat-row</text><text x="800" y="230" class="label" text-anchor="middle">bitmap header</text><rect x="915" y="180" width="180" height="80" class="accent2" /><text x="1005" y="210" class="label" text-anchor="middle">Rice-coded</text><text x="1005" y="230" class="label" text-anchor="middle">run-length stream</text><line x1="860" y1="220" x2="915" y2="220" class="arrow"/><text x="918" y="300" class="small" text-anchor="middle">Rows marked as repeats contribute no literal pixels.</text><text x="918" y="325" class="small" text-anchor="middle">Literal rows are concatenated, so runs can continue</text><text x="918" y="345" class="small" text-anchor="middle">across row boundaries.</text><rect x="760" y="385" width="316" height="100" class="box" /><text x="918" y="414" class="label" text-anchor="middle">Result: small flash footprint + very simple decoder</text><text x="918" y="438" class="small" text-anchor="middle">The runtime can stream the encoded runs directly into the resampler.</text></svg>
