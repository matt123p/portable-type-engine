<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<style>
    .title { font: 700 26px 'Arial', 'Helvetica', sans-serif; fill: #1f2937; }
    .subtitle { font: 600 16px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .label { font: 14px 'Arial', 'Helvetica', sans-serif; fill: #374151; }
    .small { font: 12px 'Arial', 'Helvetica', sans-serif; fill: #4b5563; }
    .tiny { font: 11px 'Arial', 'Helvetica', sans-serif; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
    .accent { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
    .accent2 { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; rx: 12; }
    .accent3 { fill: #ecfeff; stroke: #2dd4bf; stroke-width: 1.5; rx: 12; }
    .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .line { stroke: #94a3b8; stroke-width: 1.4; }
    .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .pixel { stroke: #cbd5e1; stroke-width: 1; }
    .note { font: italic 12px 'Arial', 'Helvetica', sans-serif; fill: #475569; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
</defs>
<text x="35" y="42" class="title" text-anchor="start">Sub-pixel placement of glyphs</text><text x="35" y="70" class="subtitle" text-anchor="start">The integer part picks the destination pixel; the remainder changes the sampling phase.</text><rect x="35" y="110" width="1030" height="190" class="panel" /><text x="55" y="140" class="subtitle" text-anchor="start">A) Snapped origin (no fractional remainder)</text><text x="55" y="160" class="small" text-anchor="start">Stem starts exactly on a pixel boundary</text><rect x="35" y="330" width="1030" height="210" class="panel" /><text x="55" y="360" class="subtitle" text-anchor="start">B) Fractional origin (+0.25 px)</text><text x="55" y="380" class="small" text-anchor="start">Coverage is shared across neighbouring pixels instead of snapping the glyph</text><rect x="170" y="165" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="225.0" y="157" class="tiny" text-anchor="middle">pixel 0</text><rect x="280" y="165" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="335.0" y="157" class="tiny" text-anchor="middle">pixel 1</text><rect x="390" y="165" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="445.0" y="157" class="tiny" text-anchor="middle">pixel 2</text><rect x="500" y="165" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="555.0" y="157" class="tiny" text-anchor="middle">pixel 3</text><rect x="610" y="165" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="665.0" y="157" class="tiny" text-anchor="middle">pixel 4</text><rect x="720" y="165" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="775.0" y="157" class="tiny" text-anchor="middle">pixel 5</text><rect x="390" y="165" width="110" height="95" fill="#111827" opacity="0.9"/><line x1="120" y1="212" x2="165" y2="212" class="arrow"/><text x="115" y="205" class="small" text-anchor="end">glyph edge</text><text x="70" y="285" class="small" text-anchor="start">output alpha:</text><rect x="190" y="275" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="225" y="298" class="small" text-anchor="middle">0</text><rect x="300" y="275" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="335" y="298" class="small" text-anchor="middle">0</text><rect x="410" y="275" width="70" height="35" fill="#000000" stroke="#64748b" stroke-width="1" rx="4"/><text x="445" y="298" class="small" text-anchor="middle">256</text><rect x="520" y="275" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="555" y="298" class="small" text-anchor="middle">0</text><rect x="630" y="275" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="665" y="298" class="small" text-anchor="middle">0</text><rect x="740" y="275" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="775" y="298" class="small" text-anchor="middle">0</text><rect x="170" y="395" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="225.0" y="387" class="tiny" text-anchor="middle">pixel 0</text><rect x="280" y="395" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="335.0" y="387" class="tiny" text-anchor="middle">pixel 1</text><rect x="390" y="395" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="445.0" y="387" class="tiny" text-anchor="middle">pixel 2</text><rect x="500" y="395" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="555.0" y="387" class="tiny" text-anchor="middle">pixel 3</text><rect x="610" y="395" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="665.0" y="387" class="tiny" text-anchor="middle">pixel 4</text><rect x="720" y="395" width="110" height="95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="775.0" y="387" class="tiny" text-anchor="middle">pixel 5</text><rect x="417.5" y="395" width="110" height="95" fill="#111827" opacity="0.32"/><rect x="417.5" y="395" width="110" height="95" fill="none" stroke="#111827" stroke-width="3"/><rect x="390" y="395" width="110" height="95" fill="#111827" opacity="0.16"/><rect x="500" y="395" width="110" height="95" fill="#111827" opacity="0.06"/><text x="100" y="458" class="small" text-anchor="start">true origin</text><line x1="105" y1="460" x2="417.5" y2="460" class="arrow"/><line x1="417.5" y1="382" x2="417.5" y2="495" class="dash"/><text x="417.5" y="372" class="small" text-anchor="middle">+0.25 px remainder</text><text x="70" y="525" class="small" text-anchor="start">output alpha:</text><rect x="190" y="515" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="225" y="538" class="small" text-anchor="middle">0</text><rect x="300" y="515" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="335" y="538" class="small" text-anchor="middle">0</text><rect x="410" y="515" width="70" height="35" fill="#404040" stroke="#64748b" stroke-width="1" rx="4"/><text x="445" y="538" class="small" text-anchor="middle">192</text><rect x="520" y="515" width="70" height="35" fill="#c0c0c0" stroke="#64748b" stroke-width="1" rx="4"/><text x="555" y="538" class="small" text-anchor="middle">64</text><rect x="630" y="515" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="665" y="538" class="small" text-anchor="middle">0</text><rect x="740" y="515" width="70" height="35" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4"/><text x="775" y="538" class="small" text-anchor="middle">0</text><text x="550" y="570" class="small" text-anchor="middle">The same master glyph is placed fractionally; only the sampling phase changes.</text></svg>
